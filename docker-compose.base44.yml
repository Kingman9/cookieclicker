services:
  web:
    image: python:3.12-slim
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - BASE44_PREVIEW_MODE
    command: ["sh", "-c", "echo \"window.BASE44_PREVIEW_MODE='$$BASE44_PREVIEW_MODE';\" > /app/env.js && exec python3 -m http.server 3000 --bind 0.0.0.0"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/index.html')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
